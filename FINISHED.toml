[[task]]
id = "documentsprovider-streaming-file-read-write"
title = "DocumentsProvider: streaming file read/write"
description = "openDocument backed by StorageManager.openProxyFileDescriptor and a ProxyFileDescriptorCallback running on a handler thread, so reads and writes stream over SFTP on demand instead of downloading whole files. Falls back to a cached temp file where the proxy FD is not usable. Also implements createDocument, deleteDocument, and renameDocument."
status = "finished"
category = "feature"
