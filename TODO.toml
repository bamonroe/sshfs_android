category = "feature"
urgency = "critical"
order = 10
created = 2026-08-03
tags = ["build"]

[[task]]
id = "define-the-host-identity-key-data-model"
title = "Define the Host / Identity / Key data model"
description = "Three separate first-class entities persisted with Room: Key (name, type, private+public material, passphrase state, imported-or-generated), Identity (name, username, optional password, optional link to a Key), Host (name, address, port, optional default Identity, freeform extra connect args for proxy/jump/ssh options). Identity references a Key; Host references a default Identity; deleting a referenced row is blocked or nulled explicitly. Record the schema in docs/architecture.md."
status = "active"
category = "feature"
urgency = "critical"
order = 20
created = 2026-08-03
tags = ["data"]

