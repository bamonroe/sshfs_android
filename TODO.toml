[[task]]
id = "biometric-device-credential-gate-before-unlocking-secrets"
title = "Biometric / device-credential gate before unlocking secrets"
description = "KeystoreSecretStore seals secrets under a plain Keystore AES key. Add an optional user-authentication-gated key (setUserAuthenticationRequired) with a BiometricPrompt in front of it, so decrypting a private key or password needs a fingerprint or device PIN. Needs a new blob prefix (v2:) so both schemes can coexist, plus a settings toggle and a re-seal pass when it is turned on or off."
